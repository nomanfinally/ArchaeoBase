services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: archaebase-postgres
    environment:
      POSTGRES_DB: archaebase
      POSTGRES_USER: archaebase
      POSTGRES_PASSWORD: archaebase
    ports:
      - "5432:5432"
    volumes:
      - archaebase-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archaebase -d archaebase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archaebase-postgres:

